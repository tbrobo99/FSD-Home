<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9" fill="none" stroke="#2563a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9" fill="none" stroke="#888888" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="1280" height="740" fill="#ffffff"/>
<text x="55" y="50" font-size="28" font-weight="600" fill="#111827">FSD Home — System Architecture &amp; Data Flow</text>
<text x="55" y="78" font-size="13" fill="#4b5563">Local sensing runs every second. The LLM is called only when an event needs a decision — never on every 1 Hz tick.</text>

<text x="55" y="115" font-size="12" font-weight="600" fill="#2563a6">1 · DATA INPUT — CONTINUOUS, LOCAL, NO LLM</text>

<rect x="55" y="135" width="320" height="110" rx="12" fill="#ffffff" stroke="#888888" stroke-width="1.6"/>
<text x="215" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Home data sources</text>
<text x="215" y="182" text-anchor="middle" font-size="12" fill="#374151">Simulated device states</text>
<text x="215" y="200" text-anchor="middle" font-size="12" fill="#374151">Optional ESP32 sensors</text>
<text x="215" y="218" text-anchor="middle" font-size="12" fill="#374151">power · temperature · humidity</text>
<text x="215" y="236" text-anchor="middle" font-size="10" fill="#6b7280">state feedback via get_state()</text>

<rect x="480" y="135" width="320" height="110" rx="12" fill="#eef4fb" stroke="#3b76bd" stroke-width="1.8"/>
<text x="640" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#123a63">Sensor loop · 1 Hz</text>
<text x="640" y="182" text-anchor="middle" font-size="12" fill="#2c5c8f">Reads rooms and appliances</text>
<text x="640" y="200" text-anchor="middle" font-size="12" fill="#2c5c8f">Builds one current snapshot</text>
<text x="640" y="218" text-anchor="middle" font-size="12" fill="#2c5c8f">local polling — no model call</text>
<text x="640" y="236" text-anchor="middle" font-size="10" fill="#3b76bd">ts · temp · humidity · W · kWh · price</text>

<rect x="905" y="135" width="320" height="110" rx="12" fill="#ffffff" stroke="#888888" stroke-width="1.6"/>
<text x="1065" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Energy context</text>
<text x="1065" y="182" text-anchor="middle" font-size="12" fill="#374151">Used / remaining kWh</text>
<text x="1065" y="200" text-anchor="middle" font-size="12" fill="#374151">Tariff · budget · Strict Mode</text>
<text x="1065" y="218" text-anchor="middle" font-size="12" fill="#374151">app/budget.py + SQLite</text>
<text x="1065" y="236" text-anchor="middle" font-size="10" fill="#6b7280">energy_state · energy_decisions</text>

<line x1="375" y1="190" x2="480" y2="190" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<text x="400" y="178" font-size="11" fill="#2563a6">readings</text>
<line x1="800" y1="190" x2="905" y2="190" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<text x="825" y="178" font-size="11" fill="#2563a6">snapshot</text>

<text x="55" y="290" font-size="12" font-weight="600" fill="#2563a6">2 · DECISION — EVENT-TRIGGERED</text>

<rect x="55" y="310" width="320" height="125" rx="12" fill="#ffffff" stroke="#888888" stroke-width="1.6"/>
<text x="215" y="335" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Agent core</text>
<text x="215" y="357" text-anchor="middle" font-size="12" fill="#374151">Receives a user command or risk event</text>
<text x="215" y="375" text-anchor="middle" font-size="12" fill="#374151">Combines request + energy context</text>
<text x="215" y="397" text-anchor="middle" font-size="11" fill="#2563a6">chat · proactive event</text>
<text x="215" y="418" text-anchor="middle" font-size="10" fill="#6b7280">REST /api/control bypasses LLM, still checked by budget gate</text>

<rect x="480" y="310" width="320" height="125" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="640" y="335" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">LLM — optional</text>
<text x="640" y="357" text-anchor="middle" font-size="12" fill="#92400e">Receives prompt + event context</text>
<text x="640" y="375" text-anchor="middle" font-size="12" fill="#92400e">Returns one structured proposal</text>
<text x="640" y="397" text-anchor="middle" font-size="11" fill="#b45309">ALLOW · BLOCK · DELAY · OPTIMIZE</text>
<text x="640" y="418" text-anchor="middle" font-size="10" fill="#92400e">event-triggered · cloud config off · fallback: rules</text>

<rect x="905" y="310" width="320" height="125" rx="12" fill="#f3f0fa" stroke="#7a5bb5" stroke-width="1.8"/>
<text x="1065" y="335" text-anchor="middle" font-size="15" font-weight="600" fill="#3b2a63">Deterministic rule validator</text>
<text x="1065" y="357" text-anchor="middle" font-size="12" fill="#5b4687">Checks budget.can_start() · safety · time</text>
<text x="1065" y="375" text-anchor="middle" font-size="12" fill="#5b4687">May override any model proposal</text>
<text x="1065" y="397" text-anchor="middle" font-size="11" fill="#7a5bb5">FINAL AUTHORITY · safe fallback</text>
<text x="1065" y="418" text-anchor="middle" font-size="10" fill="#5b4687">unknown kind rejected · BLOCK never widened</text>

<path d="M 1065 245 L 1065 275 L 215 275 L 215 310" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<text x="600" y="268" text-anchor="middle" font-size="11" fill="#2563a6">only when a command or risk event occurs</text>

<line x1="375" y1="360" x2="480" y2="360" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<text x="428" y="348" text-anchor="middle" font-size="10" fill="#2563a6">prompt + context</text>
<line x1="480" y1="395" x2="375" y2="395" stroke="#888888" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#gray)"/>
<text x="398" y="414" font-size="11" fill="#6b7280">JSON proposal</text>
<line x1="800" y1="360" x2="905" y2="360" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<text x="825" y="348" font-size="11" fill="#2563a6">validate</text>

<text x="55" y="480" font-size="12" font-weight="600" fill="#2563a6">3 · EXECUTION &amp; FEEDBACK — CLOSED LOOP</text>

<rect x="55" y="495" width="320" height="120" rx="12" fill="#eaf5ee" stroke="#2a8f5b" stroke-width="1.8"/>
<text x="215" y="520" text-anchor="middle" font-size="15" font-weight="600" fill="#124a2c">Audit execution gate</text>
<text x="215" y="542" text-anchor="middle" font-size="12" fill="#1c6540">Writes intent before acting</text>
<text x="215" y="560" text-anchor="middle" font-size="12" fill="#1c6540">BLOCK stops here</text>
<text x="215" y="582" text-anchor="middle" font-size="11" fill="#2a8f5b">audit.execute() · fail closed</text>
<text x="215" y="601" text-anchor="middle" font-size="10" fill="#1c6540">append-only audit_log</text>

<rect x="480" y="495" width="320" height="120" rx="12" fill="#ffffff" stroke="#888888" stroke-width="1.6"/>
<text x="640" y="520" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Device adapter</text>
<text x="640" y="542" text-anchor="middle" font-size="12" fill="#374151">Mock devices now</text>
<text x="640" y="560" text-anchor="middle" font-size="12" fill="#374151">LG ThinQ optional</text>
<text x="640" y="582" text-anchor="middle" font-size="11" fill="#2563a6">adapter.apply()</text>
<text x="640" y="601" text-anchor="middle" font-size="10" fill="#6b7280">dry_run · not connected</text>

<rect x="905" y="495" width="320" height="120" rx="12" fill="#ffffff" stroke="#888888" stroke-width="1.6"/>
<text x="1065" y="520" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Dashboard + decision log</text>
<text x="1065" y="542" text-anchor="middle" font-size="12" fill="#374151">Budget · reason · outcome · prompt</text>
<text x="1065" y="560" text-anchor="middle" font-size="12" fill="#374151">Shows what happened and why</text>
<text x="1065" y="582" text-anchor="middle" font-size="11" fill="#2563a6">/energy · append-only history</text>
<text x="1065" y="601" text-anchor="middle" font-size="10" fill="#6b7280">source: llm / fallback / override / rules</text>

<path d="M 1065 435 L 1065 452 L 215 452 L 215 495" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<line x1="375" y1="555" x2="480" y2="555" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<line x1="800" y1="555" x2="905" y2="555" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>

<path d="M 640 615 L 640 655 L 35 655 L 35 190 L 55 190" fill="none" stroke="#2563a6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#blue)"/>
<text x="55" y="670" font-size="11" fill="#2563a6">updated state is read on the next 1 Hz sensor tick · state feedback: get_state()</text>

<rect x="430" y="695" width="420" height="34" rx="17" fill="#eef4fb" stroke="#3b76bd" stroke-width="1.5"/>
<text x="640" y="717" text-anchor="middle" font-size="13" font-weight="600" fill="#123a63">LLM PROPOSES · RULES + BUDGET DECIDE</text>
</svg>
