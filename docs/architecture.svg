<text x="235" y="174" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#222222">Phone — Chrome / Safari (PWA)</text>
<rect x="380" y="152" width="230" height="44" rx="9" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
<text x="495" y="174" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#222222">Laptop — browser</text>
<text x="660" y="180" font-size="13" fill="#666666">Live demo: https://fsd-home-demo.duckdns.org/?ui=v6</text>

<rect x="55" y="228" width="1170" height="510" rx="16" fill="#f6f9fd" stroke="#777777" stroke-width="1.8" stroke-dasharray="9 7"/>
<text x="75" y="255" font-size="16" font-weight="600" fill="#222222">AWS Lightsail</text>

<rect x="90" y="292" width="1100" height="425" rx="12" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5"/>

<rect x="115" y="335" width="245" height="86" rx="10" fill="#eef4fb" stroke="#3b76bd" stroke-width="1.8"/>
<text x="237" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#123a63">Web shell</text>
<text x="237" y="382" text-anchor="middle" font-size="12" fill="#2c5c8f">app/web: index.html, app.js,</text>
<text x="237" y="399" text-anchor="middle" font-size="12" fill="#2c5c8f">themes · Caddy (HTTPS) → run.py (:80)</text>

<rect x="380" y="335" width="245" height="86" rx="10" fill="#eef4fb" stroke="#3b76bd" stroke-width="1.8"/>
<text x="502" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#123a63">REST API</text>
<text x="502" y="382" text-anchor="middle" font-size="12" fill="#2c5c8f">/api/snapshot · /api/chat</text>
<text x="502" y="399" text-anchor="middle" font-size="12" fill="#2c5c8f">/api/control · /api/audit</text>

<rect x="645" y="335" width="245" height="86" rx="10" fill="#eef4fb" stroke="#3b76bd" stroke-width="1.8"/>
<text x="767" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#123a63">Agent core</text>
<text x="767" y="382" text-anchor="middle" font-size="12" fill="#2c5c8f">NLU · Cascade / Agent · policy</text>
<text x="767" y="399" text-anchor="middle" font-size="12" fill="#2c5c8f">proactive loop · approval</text>

<rect x="910" y="335" width="255" height="86" rx="10" fill="#eef4fb" stroke="#3b76bd" stroke-width="1.8"/>
<text x="1037" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#123a63">Sensor loop · 1 Hz</text>
<text x="1037" y="382" text-anchor="middle" font-size="12" fill="#2c5c8f">simulated rooms + appliances</text>
<text x="1037" y="399" text-anchor="middle" font-size="12" fill="#2c5c8f">scenarios: oven / mold</text>

<rect x="115" y="450" width="370" height="86" rx="10" fill="#f3f0fa" stroke="#7a5bb5" stroke-width="1.8"/>
<text x="300" y="475" text-anchor="middle" font-size="15" font-weight="600" fill="#3b2a63">Audit gate — write before act</text>
<text x="300" y="497" text-anchor="middle" font-size="12" fill="#5b4687">action.intent → adapter.apply() → outcome</text>
<text x="300" y="514" text-anchor="middle" font-size="12" fill="#5b4687">append-only log, DB triggers</text>

<rect x="510" y="450" width="370" height="86" rx="10" fill="#fdf6e8" stroke="#b98b2f" stroke-width="1.8"/>
<text x="695" y="475" text-anchor="middle" font-size="15" font-weight="600" fill="#6b4c12">SQLite · app.db</text>
<text x="695" y="497" text-anchor="middle" font-size="12" fill="#876520">jobs · messages · logs · audit_log</text>
<text x="695" y="514" text-anchor="middle" font-size="12" fill="#876520">no external database</text>

<rect x="905" y="450" width="260" height="86" rx="10" fill="#f7f7f7" stroke="#999999" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="1035" y="475" text-anchor="middle" font-size="15" font-weight="600" fill="#444444">LLM — optional</text>
<text x="1035" y="497" text-anchor="middle" font-size="12" fill="#666666">glm-4-flash, decision layer only</text>
<text x="1035" y="514" text-anchor="middle" font-size="12" fill="#666666">fallback: deterministic rules</text>

<rect x="115" y="565" width="500" height="82" rx="10" fill="#eaf5ee" stroke="#2a8f5b" stroke-width="1.8"/>
<text x="365" y="590" text-anchor="middle" font-size="15" font-weight="600" fill="#124a2c">Device adapter interface (base.py)</text>
<text x="365" y="612" text-anchor="middle" font-size="12" fill="#1c6540">list_devices() · get_state() · apply()</text>
<text x="365" y="629" text-anchor="middle" font-size="12" fill="#1c6540">→ MockAdapter: 11 simulated devices — USED NOW</text>

<rect x="640" y="565" width="525" height="82" rx="10" fill="#f7f7f7" stroke="#999999" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="902" y="590" text-anchor="middle" font-size="15" font-weight="600" fill="#444444">ThinQAdapter — code-ready, not enabled</text>
<text x="902" y="612" text-anchor="middle" font-size="12" fill="#666666">LG ThinQ Open API → real LG appliances</text>
<text x="902" y="629" text-anchor="middle" font-size="12" fill="#666666">needs PAT token + payload calibration</text>

<line x1="235" y1="210" x2="235" y2="333" stroke="#2563a6" stroke-width="3" marker-end="url(#arrb)"/>
<text x="250" y="300" font-size="13" fill="#2563a6">HTTPS</text>
<line x1="495" y1="210" x2="480" y2="333" stroke="#2563a6" stroke-width="3" marker-end="url(#arrb)"/>
<text x="505" y="300" font-size="13" fill="#2563a6">REST /api/* · 4 s poll</text>

<line x1="360" y1="378" x2="380" y2="378" stroke="#888888" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="625" y1="378" x2="645" y2="378" stroke="#888888" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="910" y1="378" x2="890" y2="378" stroke="#2563a6" stroke-width="2" marker-end="url(#arrb)"/>
<path d="M 700 421 L 700 437 L 300 437 L 300 450" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrb)"/>
