<rect x="0" y="0" width="1280" height="1030" fill="#ffffff"/>
<text x="55" y="52" font-size="30" font-weight="600" fill="#1a1a1a">Architecture Design</text>
<text x="55" y="83" font-size="17" fill="#555555">Proactive Senior Care &amp; Comfort Agent — risk-graded autonomous home orchestration</text>

