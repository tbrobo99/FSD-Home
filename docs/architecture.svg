<line x1="300" y1="536" x2="300" y2="565" stroke="#2563a6" stroke-width="2" marker-end="url(#arrb)"/>
<line x1="485" y1="493" x2="510" y2="493" stroke="#888888" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="365" y1="621" x2="640" y2="621" stroke="#999999" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arr)"/>

<rect x="55" y="758" width="1170" height="140" rx="16" fill="#fafafa" stroke="#999999" stroke-width="1.5" stroke-dasharray="9 7"/>
<text x="75" y="785" font-size="15" font-weight="600" fill="#333333">Appliances · simulated now, real LG optional</text>
<rect x="120" y="800" width="300" height="66" rx="10" fill="#eaf5ee" stroke="#2a8f5b" stroke-width="1.8"/>
<text x="270" y="824" text-anchor="middle" font-size="15" font-weight="600" fill="#124a2c">11 mock devices</text>
<text x="270" y="846" text-anchor="middle" font-size="12" fill="#1c6540">AC · washer · dryer · fridge · oven · cooktop …</text>
<rect x="450" y="800" width="360" height="66" rx="10" fill="#f7f7f7" stroke="#999999" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="630" y="824" text-anchor="middle" font-size="15" font-weight="600" fill="#444444">Real LG appliances</text>
<text x="630" y="846" text-anchor="middle" font-size="12" fill="#666666">fridge · washer — same adapter, PAT required</text>
<rect x="840" y="800" width="330" height="66" rx="10" fill="#f7f7f7" stroke="#999999" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="1005" y="824" text-anchor="middle" font-size="15" font-weight="600" fill="#444444">ESP32 sensor — possible extension</text>
<text x="1005" y="846" text-anchor="middle" font-size="12" fill="#666666">temperature / humidity over Wi-Fi</text>

<line x1="365" y1="647" x2="270" y2="798" stroke="#2a8f5b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="902" y1="647" x2="640" y2="798" stroke="#999999" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/>

<text x="55" y="950" font-size="15" fill="#333333">Two paths for a message: home command → NLU / approval / audit → device; conversation → text-only reply, no device access.</text>
