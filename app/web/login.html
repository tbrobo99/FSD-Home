<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1119">
<title>Sign in — Home Agent</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 25%, #16263a 0%, #0b1119 60%);
    color: #e8eef5;
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 380px; padding: 32px 26px;
    background: #111b27; border: 1px solid #2a3b4f; border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  p  { margin: 0 0 24px; font-size: 14px; color: #9fb0c2; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #c7d4e1; }
  input {
    width: 100%; padding: 13px 14px; font-size: 16px;
    background: #0b1119; color: #e8eef5;
    border: 1px solid #35506d; border-radius: 10px; outline: none;
  }
  input:focus { border-color: #4f9fe0; box-shadow: 0 0 0 3px rgba(79,159,224,.2); }
  button {
    width: 100%; margin-top: 18px; padding: 13px 14px; font-size: 15px; font-weight: 700;
    color: #07121e; background: #4f9fe0; border: 0; border-radius: 10px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { min-height: 20px; margin-top: 12px; font-size: 13px; color: #ff8b8b; }
  .hint { margin-top: 18px; font-size: 12px; color: #7f92a5; text-align: center; }
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>Home Agent</h1>
    <p>This demo is password protected. Enter the shared password to view and control the house.</p>
    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="go">Sign in</button>
    <div class="err" id="err" role="alert"></div>
    <div class="hint">Your session stays for 24 hours on this device.</div>
  </form>
<script>
  const form = document.getElementById("form");
  const pw = document.getElementById("pw");
  const go = document.getElementById("go");
  const err = document.getElementById("err");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    go.disabled = true; go.textContent = "Signing in…";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw.value }),
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw new Error(d.error || "Sign in failed");
      }
      location.href = "/";
    } catch (ex) {
      err.textContent = ex.message || "Sign in failed";
      go.disabled = false; go.textContent = "Sign in";
      pw.focus();
    }
  });
</script>
</body>
</html>
