<div class="app">
  <header class="top">
    <button class="title" type="button" id="title"><span id="titleText">My Home</span><svg class="ic sm"><use href="#i-down"/></svg></button>
    <div class="top-actions">
      <button class="icon-btn" type="button" data-go="menu" aria-label="add"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button class="icon-btn" type="button" data-go="energy" aria-label="alerts"><svg class="ic"><use href="#i-bell"/></svg><i class="badge" id="bellBadge" hidden></i></button>
      <button class="icon-btn" type="button" data-go="menu" aria-label="more"><svg class="ic"><use href="#i-dots"/></svg></button>
    </div>
  </header>
  <div class="chips" id="roomChips" hidden></div>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabbar" aria-label="tabs">
  <button type="button" data-tab="home" class="on"><svg class="ic"><use href="#i-home"/></svg><span data-t="tab.home">Home</span></button>
  <button type="button" data-tab="devices"><svg class="ic"><use href="#i-devices"/></svg><span data-t="tab.devices">Devices</span></button>
  <button type="button" data-tab="energy"><svg class="ic"><use href="#i-bolt"/></svg><span data-t="tab.energy">Energy</span></button>
  <button type="button" data-tab="menu"><svg class="ic"><use href="#i-menu"/></svg><span data-t="tab.menu">Menu</span></button>
</nav>
